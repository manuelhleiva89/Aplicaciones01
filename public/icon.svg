<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d52e8" />
      <stop offset="100%" stop-color="#0a2370" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#05133d" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Blue Squircle Background -->
  <rect x="5" y="5" width="90" height="90" rx="26" fill="url(#bgGrad)" filter="url(#shadow)" />

  <!-- Logo Graphics Group -->
  <g transform="translate(0, 0)">
    <!-- Diagonal Emerald Arrow Shaft (Bottom Left to Top Right) -->
    <path d="M 30 70 L 68 32" stroke="url(#greenGrad)" stroke-width="8.5" stroke-linecap="round" fill="none" />
    
    <!-- Arrowhead at Top Right -->
    <path d="M 52 30 L 71 29 L 70 48" stroke="url(#greenGrad)" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Vertical White Dollar Line -->
    <line x1="50" y1="26" x2="50" y2="74" stroke="#ffffff" stroke-width="7" stroke-linecap="round" />

    <!-- White Dollar 'S' Curve -->
    <path d="M 64 38 C 64 31 57 32 50 32 C 41 32 40 43 50 48 C 62 54 60 68 50 68 C 42 68 36 67 36 60" 
          stroke="#ffffff" 
          stroke-width="8" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          fill="none" />
  </g>
</svg>
